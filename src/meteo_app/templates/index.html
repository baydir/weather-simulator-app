<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Simulateur météo</title>
</head>
<body>
    <h1>Simulateur météo</h1>
    <p>Bienvenue sur le simulateur météo climatique.</p>

    <form action="/results" method="POST">
        <label for="location">Lieu :</label>
        <input type="text" id="location" name="location" placeholder="Ex : Pontarlier" required>
        <br><br>

        <label for="start_date">Date de début :</label>
        <input type="date" id="start_date" name="start_date" min="1950-01-01" max="2050-12-31" required>
        <br><br>

        <label for="end_date">Date de fin :</label>
        <input type="date" id="end_date" name="end_date" min="1950-01-01" max="2050-12-31" required>
        <br><br>

        <button type="submit">Voir la météo</button>
    </form>
</body>
</html>
