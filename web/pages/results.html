<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Simulator : explorer les années</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/results.js"></script>
  </head>
  <body class="results explorer" data-season="summer">
    <a class="skip" href="#days" data-text="site.skipToDays"></a>
    <header class="banner">
      <a href="/" data-text="results.back"></a>
      <p class="eyebrow" data-text="home.eyebrow"></p>
      <h1 id="place"></h1>
      <p class="tagline"><span id="range"></span><span id="count"></span></p>
    </header>
    <main>
      <p id="wait" class="status" aria-live="polite" data-text="results.loading"></p>
      <p id="failure" class="failure" role="alert" hidden></p>
      <section id="comparison" class="explore-panel" hidden>
        <h2 data-text="explorer.title"></h2>
        <p data-text="explorer.intro"></p>
        <form id="add-year" class="year-controls">
          <div class="field">
            <label for="compare-year" data-text="explorer.year"></label>
            <select id="compare-year"></select>
          </div>
          <button id="add-button" type="submit" data-text="explorer.add"></button>
        </form>
        <p id="compare-status" class="status" aria-live="polite"></p>
        <p id="compare-failure" class="failure" role="alert" hidden></p>
        <p class="reading-note" data-text="explorer.variability"></p>
        <h2 data-text="heatCalendar.periodTitle"></h2>
        <p class="reading-note" data-text="heatCalendar.intro"></p>
        <div id="calendar-mode" class="calendar-modes" role="group" data-attr-aria-label="heatCalendar.periodTitle">
          <button type="button" id="calendar-highs" aria-pressed="true" data-text="heatCalendar.highs"></button>
          <button type="button" id="calendar-lows" aria-pressed="false" data-text="heatCalendar.lows"></button>
        </div>
        <p id="calendar-reading" class="reading-note" data-text="heatCalendar.highNote"></p>
        <div id="year-charts"></div>
      </section>
      <section id="climate" class="climate-panel" aria-labelledby="climate-title" hidden>
        <h2 id="climate-title" data-text="climate.title"></h2>
        <p data-text="climate.intro"></p>
        <p id="climate-window" class="reading-note"></p>
        <div class="climate-actions">
          <button id="climate-start" type="button" data-text="climate.start"></button>
          <button id="climate-stop" type="button" data-text="climate.stop" hidden></button>
        </div>
        <p id="climate-status" class="status" aria-live="polite"></p>
        <p id="climate-error" class="failure" role="alert" hidden></p>
        <p id="climate-coverage-limit" class="reading-note" data-text="climate.limit" hidden></p>
        <div id="climate-cards"></div>
        <p class="reading-note" data-text="climate.method"></p>
        <p id="climate-warning" class="warning" data-text="warning.notAForecast" hidden></p>
        <details id="climate-annual" class="comparison-details" open>
          <summary data-text="climate.chart"></summary>
          <p class="reading-note" data-text="climate.chartNote"></p>
          <div id="climate-plot"></div>
          <details class="comparison-details">
            <summary data-text="climate.details"></summary>
            <p class="reading-note" data-text="climate.detailNote"></p>
            <div id="climate-table"></div>
          </details>
        </details>
        <p class="reading-note" data-text="climate.quota"></p>
      </section>
      <section id="daily" hidden>
        <h2 data-text="explorer.daily"></h2>
        <aside id="warning" class="warning" hidden>
          <p data-text="warning.notAForecast"></p>
        </aside>
        <ol id="days" class="band" tabindex="0" role="group" data-attr-aria-label="results.bandLabel"></ol>
        <p id="humid-note" class="humid-note" hidden></p>
      </section>
    </main>
    <footer class="banner">
      <a href="/documentation" data-text="site.documentation"></a>
    </footer>
  </body>
</html>
