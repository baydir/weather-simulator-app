<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather Simulator</title>
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <script type="module" src="/static/js/home.js"></script>
  </head>
  <body class="home explorer">
    <a class="skip" href="#search" data-text="site.skip"></a>
    <div class="sky" aria-hidden="true"></div>
    <header class="banner">
      <p class="eyebrow" data-text="home.eyebrow"></p>
      <h1 id="prompt" data-text="home.title"></h1>
      <p class="intro" data-text="home.intro"></p>
      <p class="tagline" id="promise" data-text="home.promise"></p>
    </header>

    <main>
      <form id="search" method="get" action="/resultats" class="search">
        <div class="field">
          <label for="lieu" data-text="form.place"></label>
          <input
            type="text"
            id="lieu"
            name="lieu"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="candidates"
            data-attr-placeholder="form.placeHint"
          />
          <ul id="candidates" class="candidates" role="listbox" hidden></ul>
          <p id="chosen" class="chosen" hidden>
            <span id="chosen-name"></span>
            <button type="button" id="change" class="link" data-text="form.change"></button>
          </p>
        </div>
        <p id="place-status" class="status"></p>
        <p id="found" class="sr-only" aria-live="polite"></p>

        <input type="hidden" id="lat" name="lat" />
        <input type="hidden" id="lon" name="lon" />
        <div class="modes" role="group" data-attr-aria-label="form.modeLabel">
          <button
            type="button"
            id="mode-season"
            class="mode"
            aria-pressed="false"
            aria-controls="panel-season"
            data-text="form.modeSeason"
          ></button>
          <button
            type="button"
            id="mode-dates"
            class="mode"
            aria-pressed="true"
            aria-controls="panel-dates"
            data-text="form.modeDates"
          ></button>
        </div>

        <div class="dates" id="panel-dates">
          <p class="field">
            <label for="debut" data-text="form.from"></label>
            <input type="date" id="debut" name="debut" required />
          </p>
          <p class="field">
            <label for="fin" data-text="form.to"></label>
            <input type="date" id="fin" name="fin" required />
          </p>
        </div>
        <div class="dates" id="panel-season" hidden>
          <p class="field">
            <label for="saison" data-text="form.season"></label>
            <select id="saison"></select>
          </p>
          <p class="field">
            <label for="annee" data-text="form.year"></label>
            <select id="annee"></select>
          </p>
        </div>
        <p id="go"><button type="submit" data-text="form.submit"></button></p>

        <p id="status" class="status" aria-live="polite"></p>
      </form>
    </main>
    <footer class="banner">
      <p class="tagline">
        <span class="note-mark" aria-hidden="true">*</span
        ><span id="coverage"></span
        ><span data-text="warning.note"></span>
      </p>
      <p class="tagline" data-text="warning.noteMeaning"></p>
      <p class="doc-link">
        <a href="/documentation" data-text="site.documentation"></a>
      </p>
    </footer>
  </body>
</html>
